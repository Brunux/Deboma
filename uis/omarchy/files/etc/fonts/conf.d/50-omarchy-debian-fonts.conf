<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Debian ships no Nerd-patched JetBrains Mono. The Omarchy shell, its config, the
  generated theme files and the terminals all ask for the family
  "JetBrainsMono Nerd Font", which does not exist here, so fontconfig fell back
  to a proportional face (Noto Sans) and the whole desktop - foot included -
  rendered in the wrong font. Map the requested name onto what Debian does ship:
  "JetBrains Mono" for the text, the DFSG-safe icon fonts for the Nerd glyphs.

  Upstream's default/fontconfig/conf.avail/50-omarchy.conf is deliberately NOT
  installed (see uis/omarchy/README.md): it assumes the Nerd Font family exists
  and, on Debian, its generic-family rules collapse sans-serif into the
  monospace face and pull serif toward Noto Naskh Arabic.
-->
<fontconfig>
  <alias binding="strong">
    <family>JetBrainsMono Nerd Font</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
    <accept>
      <family>Symbols Nerd Font</family>
      <family>FontAwesome</family>
      <family>Material Design Icons</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <!-- Keep the generic monospace family on the face Omarchy uses. This is
       monospace -> monospace, so nothing proportional is affected. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
