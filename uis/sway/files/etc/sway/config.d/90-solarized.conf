# Solarized Dark theme, ported from Nura.

# Typography
font pango:monospace 10

# Window borders
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart

# Solarized Dark palette
# Base:         #002b36
# Base 1:       #586e75
# Base 0:       #839496
# Base 1 light: #93a1a1
# Cyan:         #2aa198
# Yellow:       #b58900
# Red:          #dc322f

client.focused          #2aa198 #073642 #fdf6e3 #b58900 #2aa198
client.focused_inactive #586e75 #073642 #93a1a1 #586e75 #586e75
client.unfocused        #073642 #002b36 #839496 #073642 #073642
client.urgent           #dc322f #dc322f #fdf6e3 #dc322f #dc322f

# Comfortable spacing without wasting screen space
gaps inner 8
gaps outer 4
