# Screenshots: grimshot

# Alt + Shift + F: save a fullscreen screenshot
bindsym $mod+Shift+f exec grimshot save screen

# Mod + Shift + S: select an area and save it
bindsym $mod+Shift+s exec grimshot save area

# Mod + Ctrl + S: select an area and copy it
bindsym $mod+Ctrl+s exec grimshot copy area
