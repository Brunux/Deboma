# Lock with the window-manager modifier (Alt), or with the Chromebook's Lock key.
bindsym $mod+Escape exec swaylock -c 002b36

# The Lock key (right-most key of the top row) emits KEY_SLEEP, and keyd leaves
# that key alone on purpose (see etc/keyd/default.conf), so systemd-logind
# suspends the machine on the key itself: no polkit, no session lookup, no
# shortcut involved.  This binding only locks the screen -- logind reaches the
# kernel about 0.3 s later, which is enough for swaylock to have drawn.
bindsym XF86Sleep exec swaylock -f -c 002b36

# If the Lock key is ever remapped to KEY_COFFEE (Nura's `sleep = coffee`), it
# arrives as XF86ScreenSaver and logind never sees a suspend key; the session
# then has to drive the suspend itself through the sway-suspend helper.
bindsym XF86ScreenSaver exec sh -c 'swaylock -f -c 002b36; sleep 1; exec /home/brunux/.config/bin/sway-suspend'
